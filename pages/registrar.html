<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar - Meu App</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #2b6777;
      color: #ffffff;
      padding: 1rem 0;
    }
    .header .container h1 {
      margin: 0;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .main {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      padding: 2rem 0;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }
    .card h2 {
      text-align: center;
      color: #2b6777;
      margin-bottom: 2rem;
      font-size: 1.8rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #2b6777;
    }
    label i {
      margin-right: 0.5rem;
      vertical-align: middle;
      color: #52ab98;
    }
    input {
      width: 100%;
      padding: 0.875rem;
      border: 2px solid #c8d8e4;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #52ab98;
      box-shadow: 0 0 0 3px rgba(82, 171, 152, 0.1);
    }
    .error {
      display: none;
      color: #ff4757;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    .password-strength {
      margin-top: 0.5rem;
    }
    .strength-bar {
      height: 4px;
      background-color: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      background-color: #dc3545;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .form-group.checkbox-group label {
      display: flex;
      align-items: flex-start;
      cursor: pointer;
      font-weight: normal;
      color: #555;
      font-size: 0.95rem;
    }
    .form-group.checkbox-group input[type="checkbox"] {
      width: auto;
      margin-right: 0.75rem;
      margin-top: 0.15rem;
      accent-color: #52ab98;
    }
    .form-group.checkbox-group a {
      color: #52ab98;
      text-decoration: none;
    }
    .form-group.checkbox-group a:hover {
      text-decoration: underline;
    }
    #globalError, #successMsg {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
      font-weight: 500;
    }
    #globalError {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    #successMsg {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    #registerBtn {
      width: 100%;
      padding: 1rem;
      background-color: #52ab98;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    #registerBtn:hover:not(:disabled) {
      background-color: #45a389;
    }
    #registerBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
    }
    .login-link a {
      color: #52ab98;
      text-decoration: none;
      font-weight: 500;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .footer {
      background-color: #2b6777;
      color: #c8d8e4;
      padding: 1.5rem 0;
      text-align: center;
      font-size: 0.9rem;
      margin-top: auto;
    }
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
        margin: 0 0.5rem;
      }
      .header .container h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1><i class="material-icons">account_circle</i> Meu App</h1>
    </div>
  </header>
  <main class="main">
    <div class="container">
      <div class="card">
        <h2>Crie sua conta</h2>
        <form id="registerForm">
          <div class="form-group">
            <label for="nome"><i class="material-icons">person</i> Nome completo</label>
            <input type="text" id="nome" required>
            <small id="error-nome" class="error"></small>
          </div>
          <div class="form-group">
            <label for="email"><i class="material-icons">email</i> Email</label>
            <input type="email" id="email" required>
            <small id="error-email" class="error"></small>
          </div>
          <div class="form-group">
            <label for="password"><i class="material-icons">lock</i> Senha</label>
            <input type="password" id="password" required>
            <small id="error-password" class="error"></small>
            <div class="password-strength">
              <div id="strengthBar" class="strength-bar">
                <div id="strengthFill" class="strength-fill"></div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="confirmPassword"><i class="material-icons">lock_outline</i> Confirmar Senha</label>
            <input type="password" id="confirmPassword" required>
            <small id="error-confirm" class="error"></small>
          </div>
          <div class="form-group checkbox-group">
            <label for="terms">
              <input type="checkbox" id="terms">
              Concordo com os <a href="#" target="_blank">Termos de Uso</a>
            </label>
            <small id="error-terms" class="error"></small>
          </div>
          <div id="globalError" class="error-global"></div>
          <div id="successMsg" class="success-msg"></div>
          <button type="submit" id="registerBtn" disabled>
            <span id="btnText">Criar Conta</span>
            <span id="spinner" class="spinner"></span>
          </button>
        </form>
        <p class="login-link">Já tenho conta? <a href="login.html">Entrar aqui</a></p>
      </div>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Meu App. Todos os direitos reservados.</p>
    </div>
  </footer>
  <script type="module">
    import { registerUser } from '../lib/supabaseClient.js'
    window.registerUser = registerUser
  </script>
  <script>
    // Código JavaScript completo com validação em tempo real, força de senha, loading e integração Supabase
    // Assume que supabaseClient.js define window.supabase e window.registerUser(email, password, nome)
    document.addEventListener('DOMContentLoaded', function() {
      // Elementos do DOM
      const nome = document.getElementById('nome');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const terms = document.getElementById('terms');
      const registerBtn = document.getElementById('registerBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      const errors = {
        nome: document.getElementById('error-nome'),
        email: document.getElementById('error-email'),
        password: document.getElementById('error-password'),
        confirm: document.getElementById('error-confirm'),
        terms: document.getElementById('error-terms')
      };
      const globalError = document.getElementById('globalError');
      const successMsg = document.getElementById('successMsg');
      const form = document.getElementById('registerForm');

      let validState = {
        nome: false,
        email: false,
        password: false,
        confirm: false,
        terms: false,
        emailUnique: true
      };
      let emailChecked = false;

      // Verifica se Supabase está carregado
      if (typeof window.supabase === 'undefined' || typeof window.registerUser === 'undefined') {
        showGlobalError('Biblioteca Supabase não encontrada. Verifique o arquivo supabaseClient.js.');
        return;
      }

      // Funções auxiliares para erros
      function clearError(key) {
        errors[key].textContent = '';
        errors[key].style.display = 'none';
      }

      function showError(key, message) {
        errors[key].textContent = message;
        errors[key].style.display = 'block';
      }

      function updateButtonState() {
        const isValid = validState.nome && validState.email && validState.password && validState.confirm && validState.terms && validState.emailUnique;
        registerBtn.disabled = !isValid;
      }

      // Validação Nome (mínimo 3 caracteres)
      function validateNome() {
        const value = nome.value.trim();
        if (value.length < 3) {
          showError('nome', 'Nome deve ter pelo menos 3 caracteres.');
          validState.nome = false;
        } else {
          clearError('nome');
          validState.nome = true;
        }
        updateButtonState();
      }

      // Validação Email formato
      function validateEmail() {
        const value = email.value.trim();
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!regex.test(value)) {
          showError('email', 'Por favor, insira um email válido.');
          validState.email = false;
        } else {
          clearError('email');
          validState.email = true;
        }
        updateButtonState();
      }

      // Verificação se email já existe no Supabase (tabela profiles)
      async function checkEmailUnique() {
        const value = email.value.trim();
        if (!validState.email) return false;
        try {
          const { data } = await window.supabase
            .from('profiles')
            .select('id')
            .eq('email', value)
            .maybeSingle();
          if (data) {
            showError('email', 'Este email já está registrado.');
            validState.emailUnique = false;
            emailChecked = true;
            updateButtonState();
            return false;
          } else {
            if (errors.email.textContent.includes('registrado')) {
              clearError('email');
            }
            validState.emailUnique = true;
            emailChecked = true;
            updateButtonState();
            return true;
          }
        } catch (err) {
          showError('email', 'Erro ao verificar disponibilidade do email.');
          validState.emailUnique = false;
          updateButtonState();
          return false;
        }
      }

      // Validação Senha (mínimo 6 caracteres)
      function validatePassword() {
        const value = password.value;
        if (value.length < 6) {
          showError('password', 'Senha deve ter pelo menos 6 caracteres.');
          validState.password = false;
        } else {
          clearError('password');
          validState.password = true;
        }
        updatePasswordStrength();
        validateConfirm();
        updateButtonState();
      }

      // Validação Confirmar Senha
      function validateConfirm() {
        const value = confirmPassword.value;
        if (value !== password.value) {
          showError('confirm', 'As senhas não coincidem.');
          validState.confirm = false;
        } else if (value === '') {
          showError('confirm', 'Por favor, confirme a senha.');
          validState.confirm = false;
        } else {
          clearError('confirm');
          validState.confirm = true;
        }
        updateButtonState();
      }

      // Validação Termos
      function validateTerms() {
        if (!terms.checked) {
          showError('terms', 'Você deve concordar com os termos.');
          validState.terms = false;
        } else {
          clearError('terms');
          validState.terms = true;
        }
        updateButtonState();
      }

      // Barra de força da senha (4 níveis: vermelho, laranja, amarelo, verde)
      function updatePasswordStrength() {
        const value = password.value;
        let score = 0;
        if (value.length >= 6) score++;
        if (value.length >= 8) score++;
        if (/[a-z]/.test(value)) score++;
        if (/[A-Z]/.test(value)) score++;
        if (/[0-9]/.test(value)) score++;
        if (/[^A-Za-z0-9]/.test(value)) score++;
        const percentage = Math.round((score / 6) * 100);
        const fill = document.getElementById('strengthFill');
        fill.style.width = percentage + '%';
        if (percentage < 25) {
          fill.style.backgroundColor = '#ff4757'; // Vermelho
        } else if (percentage < 50) {
          fill.style.backgroundColor = '#ffa502'; // Laranja
        } else if (percentage < 75) {
          fill.style.backgroundColor = '#fffa00'; // Amarelo
        } else {
          fill.style.backgroundColor = '#2ed573'; // Verde
        }
      }

      function showGlobalError(msg) {
        globalError.textContent = msg;
        globalError.style.display = 'block';
        successMsg.style.display = 'none';
      }

      function showSuccess(msg) {
        successMsg.textContent = msg;
        successMsg.style.display = 'block';
        globalError.style.display = 'none';
      }

      function setLoading(loading) {
        if (loading) {
          btnText.textContent = 'Criando conta...';
          spinner.style.display = 'inline-block';
          registerBtn.disabled = true;
        } else {
          btnText.textContent = 'Criar Conta';
          spinner.style.display = 'none';
        }
      }

      // Event listeners para validação em tempo real
      nome.addEventListener('input', validateNome);
      nome.addEventListener('blur', validateNome);
      email.addEventListener('input', validateEmail);
      email.addEventListener('blur', () => {
        validateEmail();
        if (validState.email) {
          checkEmailUnique();
        }
      });
      password.addEventListener('input', validatePassword);
      confirmPassword.addEventListener('input', validateConfirm);
      terms.addEventListener('change', validateTerms);

      // Handler de submit com integração Supabase
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Revalida tudo
        validateNome();
        validateEmail();
        validatePassword();
        validateConfirm();
        validateTerms();

        if (!validState.nome || !validState.email || !validState.password || !validState.confirm || !validState.terms) {
          showGlobalError('Por favor, corrija os erros acima.');
          return;
        }

        // Verifica email único antes de registrar
        if (validState.email && validState.emailUnique) {
          const isUnique = await checkEmailUnique();
          if (!isUnique) {
            return;
          }
        }

        // Chama registerUser do Supabase
        setLoading(true);
        try {
          await window.registerUser(email.value.trim(), password.value, nome.value.trim());
          showSuccess('Conta criada com sucesso! Redirecionando para o login...');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } catch (error) {
          console.error('Erro no registro:', error);
          let msg = 'Erro ao criar a conta. Tente novamente.';
          if (error.message?.includes('already registered') || error.message?.includes('already exists')) {
            msg = 'Este email já está registrado.';
          } else if (error.message?.includes('network') || error.message?.includes('fetch')) {
            msg = 'Erro de conexão. Verifique sua internet.';
          } else if (error.message?.includes('Password')) {
            msg = 'Senha inválida. Mínimo 6 caracteres.';
          } else {
            msg = error.message || msg;
          }
          showGlobalError(msg);
        } finally {
          setLoading(false);
          updateButtonState();
        }
      });

      // Estado inicial do botão
      updateButtonState();
    });
  </script>
</body>
</html>
