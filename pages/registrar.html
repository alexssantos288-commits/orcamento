<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - MeuApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --petroleo: #2b6777;
            --agua: #52ab98;
            --azul-cinza: #c8d8e4;
            --white: #ffffff;
            --cinza: #f2f2f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--cinza);
            color: var(--petroleo);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        header {
            background: var(--petroleo);
            color: var(--white);
            padding: 1rem 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
        }

        ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        ul a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        ul a:hover,
        ul a.active {
            opacity: 0.8;
        }

        main {
            min-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }

        .card {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--petroleo);
        }

        .field {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--petroleo);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--azul-cinza);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--agua);
        }

        .password-input {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--azul-cinza);
            user-select: none;
        }

        .strength {
            margin: 0.5rem 0 1rem;
        }

        .bar {
            height: 4px;
            background: var(--azul-cinza);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        #strength-text {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .checkbox {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .checkbox input[type="checkbox"] {
            width: auto;
            margin: 0;
            margin-top: 0.2rem;
            transform: scale(1.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--agua);
            color: var(--white);
            border: none;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #429e82;
        }

        button:disabled {
            background: var(--azul-cinza);
            cursor: not-allowed;
        }

        .error {
            color: #e74c3c;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: block;
            min-height: 1.2em;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .link-login {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }

        .link-login a {
            color: var(--agua);
            text-decoration: none;
            font-weight: 500;
        }

        footer {
            background: var(--petroleo);
            color: var(--white);
            text-align: center;
            padding: 1.5rem 0;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 1rem;
            }

            ul {
                gap: 1rem;
            }

            .card {
                padding: 1.5rem;
                margin: 1rem;
            }
        }

        @media (max-width: 480px) {
            main {
                padding: 1rem 0;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">MeuApp</div>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="#" class="active">Registrar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="card">
            <h1>Crie sua conta</h1>
            <form id="form-registro">
                <div class="field">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                    <span class="error" id="erro-nome"></span>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                    <span class="error" id="erro-email"></span>
                </div>

                <div class="field">
                    <label for="senha">Senha</label>
                    <div class="password-input">
                        <input type="password" id="senha" placeholder="Crie uma senha segura" required>
                        <span class="toggle" id="toggle-senha"><span class="material-icons">visibility_off</span></span>
                    </div>
                    <div class="strength">
                        <div class="bar">
                            <div class="progress" id="progress-bar"></div>
                        </div>
                        <span id="strength-text">Senha muito fraca</span>
                    </div>
                    <span class="error" id="erro-senha"></span>
                </div>

                <div class="field">
                    <label for="confirma-senha">Confirmar Senha</label>
                    <input type="password" id="confirma-senha" placeholder="Confirme sua senha" required>
                    <span class="error" id="erro-confirma"></span>
                </div>

                <div class="field checkbox">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Concordo com os <a href="#">Termos de Uso</a></label>
                    <span class="error" id="erro-termos"></span>
                </div>

                <button type="submit" id="criar" disabled>Criar Conta</button>
                <div id="sucesso" class="success">Conta criada com sucesso! Redirecionando para login...</div>
            </form>
            <p class="link-login">Já tenho conta? <a href="login.html">Entrar</a></p>
        </div>
    </main>

    <footer class="container">
        <p>&copy; 2024 MeuApp. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Simple hash function
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36);
        }

        // Get users from localStorage
        function getUsers() {
            const users = localStorage.getItem('users');
            return users ? JSON.parse(users) : [];
        }

        // Save users to localStorage
        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        // Elements
        const nome = document.getElementById('nome');
        const email = document.getElementById('email');
        const senha = document.getElementById('senha');
        const confirmaSenha = document.getElementById('confirma-senha');
        const termos = document.getElementById('termos');
        const criarBtn = document.getElementById('criar');
        const toggleSenha = document.getElementById('toggle-senha');
        const progressBar = document.getElementById('progress-bar');
        const strengthText = document.getElementById('strength-text');
        const sucesso = document.getElementById('sucesso');

        // Error elements
        const erros = {
            nome: document.getElementById('erro-nome'),
            email: document.getElementById('erro-email'),
            senha: document.getElementById('erro-senha'),
            confirma: document.getElementById('erro-confirma'),
            termos: document.getElementById('erro-termos')
        };

        // Clear error
        function clearError(id) {
            erros[id].textContent = '';
            erros[id].className = 'error';
        }

        // Show error
        function showError(id, msg) {
            erros[id].textContent = msg;
        }

        // Validate name
        function validateNome() {
            const value = nome.value.trim();
            clearError('nome');
            if (value.length < 3) {
                showError('nome', 'Nome deve ter pelo menos 3 caracteres');
                return false;
            }
            return true;
        }

        // Validate email
        function validateEmail() {
            const value = email.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            clearError('email');
            if (!emailRegex.test(value)) {
                showError('email', 'Email inválido');
                return false;
            }
            const users = getUsers();
            if (users.find(u => u.email === value)) {
                showError('email', 'Email já registrado');
                return false;
            }
            return true;
        }

        // Calculate password strength
        function calculateStrength(password) {
            let score = 0;
            if (password.length >= 12) score += 2;
            else if (password.length >= 8) score += 1;
            else if (password.length >= 6) score += 0.5;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[a-z]/.test(password)) score += 0.5;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;
            return Math.min(score / 5 * 100, 100);
        }

        // Update strength
        function updateStrength() {
            const pass = senha.value;
            const score = calculateStrength(pass);
            progressBar.style.width = score + '%';
            let text = 'Senha muito fraca';
            let color = '#e74c3c'; // red
            if (score >= 70) {
                text = 'Senha forte';
                color = '#27ae60'; // green
            } else if (score >= 40) {
                text = 'Senha média';
                color = '#f39c12'; // yellow
            }
            progressBar.style.backgroundColor = color;
            strengthText.textContent = text;
            strengthText.style.color = color;
        }

        // Validate password
        function validateSenha() {
            const value = senha.value;
            clearError('senha');
            if (value.length < 6) {
                showError('senha', 'Senha deve ter pelo menos 6 caracteres');
                return false;
            }
            const score = calculateStrength(value);
            if (score < 40) {
                showError('senha', 'Senha muito fraca. Use mais critérios');
                return false;
            }
            return true;
        }

        // Validate confirm password
        function validateConfirma() {
            const value = confirmaSenha.value;
            clearError('confirma');
            if (value !== senha.value) {
                showError('confirma', 'Senhas não coincidem');
                return false;
            }
            return true;
        }

        // Validate terms
        function validateTermos() {
            clearError('termos');
            if (!termos.checked) {
                showError('termos', 'Você deve concordar com os termos');
                return false;
            }
            return true;
        }

        // Validate all
        function validateAll() {
            const isValid = validateNome() &&
                           validateEmail() &&
                           validateSenha() &&
                           validateConfirma() &&
                           validateTermos();
            criarBtn.disabled = !isValid;
            return isValid;
        }

        // Event listeners
        nome.addEventListener('input', validateAll);
        email.addEventListener('input', validateAll);
        senha.addEventListener('input', () => {
            updateStrength();
            validateAll();
        });
        confirmaSenha.addEventListener('input', validateAll);
        termos.addEventListener('change', validateAll);

        // Password toggle
        toggleSenha.addEventListener('click', () => {
            const type = senha.type === 'password' ? 'text' : 'password';
            senha.type = type;
            const icon = toggleSenha.querySelector('.material-icons');
            icon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        // Form submit
        document.getElementById('form-registro').addEventListener('submit', (e) => {
            e.preventDefault();
            if (validateAll()) {
                const users = getUsers();
                const senhaHash = simpleHash(senha.value);
                users.push({
                    nome: nome.value.trim(),
                    email: email.value.trim(),
                    senhaHash
                });
                saveUsers(users);
                sucesso.style.display = 'block';
                criarBtn.disabled = true;
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
