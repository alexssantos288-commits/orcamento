<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script type="module">
        import { loginUser } from '../lib/supabaseClient.js'
        window.loginUser = loginUser
      </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #2b6777 0%, #52ab98 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }
        header {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            text-align: center;
            color: #ffffff;
        }
        header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }
        #globalError {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin-bottom: 1rem;
            display: none;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        label {
            font-weight: 500;
            color: #2b6777;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        input[type="email"], input[type="password"] {
            padding: 0.75rem;
            border: 2px solid #c8d8e4;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #52ab98;
        }
        .error {
            color: #e74c3c;
            font-size: 0.875rem;
            min-height: 1.25rem;
            display: block;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        button {
            background: linear-gradient(135deg, #52ab98, #2b6777);
            color: #ffffff;
            border: none;
            padding: 1rem 3rem 1rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        button.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }
        .links {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
        }
        .links a {
            color: #52ab98;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        footer {
            background: #f2f2f2;
            padding: 1rem;
            text-align: center;
            color: #666;
        }
        @media (min-width: 768px) {
            .login-card {
                padding: 3rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="material-icons" style="font-size: 2rem;">account_circle</span> MyApp</h1>
    </header>
    <main>
        <div class="login-card">
            <div id="globalError"></div>
            <form id="loginForm">
                <div>
                    <label for="email"><span class="material-icons">email</span> Email</label>
                    <input type="email" id="email" required>
                    <span id="emailError" class="error"></span>
                </div>
                <div>
                    <label for="password"><span class="material-icons">lock</span> Senha</label>
                    <input type="password" id="password" required>
                    <span id="passwordError" class="error"></span>
                </div>
                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar-me</label>
                </div>
                <button type="submit" id="loginBtn" disabled>Entrar</button>
                <div class="links">
                    <a href="registrar.html">Criar conta</a>
                    <a href="forgot-password.html">Esqueceu a senha?</a>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 MyApp. Todos os direitos reservados.</p>
    </footer>
    <script>
        // Código JavaScript completo com validação em tempo real, loading state e integração Supabase
        'use strict';

        // Elementos do DOM
        const form = document.getElementById('loginForm');
        const emailIn = document.getElementById('email');
        const passIn = document.getElementById('password');
        const rememberCh = document.getElementById('remember');
        const loginBtn = document.getElementById('loginBtn');
        const emailErr = document.getElementById('emailError');
        const passErr = document.getElementById('passwordError');
        const globalErr = document.getElementById('globalError');

        // Regex para validação de email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Funções de validação
        function validateEmail() {
            const val = emailIn.value.trim();
            if (!val) {
                showFieldError(emailErr, '');
                return false;
            }
            if (!emailRegex.test(val)) {
                showFieldError(emailErr, 'Email inválido');
                return false;
            }
            showFieldError(emailErr, '');
            return true;
        }

        function validatePassword() {
            const val = passIn.value;
            if (val.length < 6) {
                showFieldError(passErr, 'Senha deve ter pelo menos 6 caracteres');
                return false;
            }
            showFieldError(passErr, '');
            return true;
        }

        function showFieldError(el, msg) {
            el.textContent = msg;
        }

        function validateForm() {
            const isValid = validateEmail() && validatePassword();
            loginBtn.disabled = !isValid;
        }

        // Event listeners para validação em tempo real
        emailIn.addEventListener('input', () => {
            validateEmail();
            validateForm();
        });
        emailIn.addEventListener('blur', validateEmail);

        passIn.addEventListener('input', () => {
            validatePassword();
            validateForm();
        });
        passIn.addEventListener('blur', validatePassword);

        // Função para mostrar erro global
        function showGlobalError(msg) {
            globalErr.textContent = msg;
            globalErr.style.display = 'block';
        }

        function hideGlobalError() {
            globalErr.style.display = 'none';
        }

        // Handler de submit do formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!validateForm()) return;

            const originalText = 'Entrar';
            const loadingText = 'Entrando';
            loginBtn.disabled = true;
            loginBtn.textContent = loadingText;
            loginBtn.classList.add('loading');
            hideGlobalError();

            try {
                // Integração com Supabase via loginUser
                const { data, error } = await loginUser(emailIn.value.trim(), passIn.value);
                if (error) {
                    throw new Error(error.message);
                }
                if (data?.user && data?.session) {
                    // Salva token no localStorage
                    localStorage.setItem('access_token', data.session.access_token);
                    // Se lembrar-me marcado, salva email
                    if (rememberCh.checked) {
                        localStorage.setItem('remembered_email', emailIn.value.trim());
                    }
                    // Redireciona após sucesso
                    window.location.href = 'dashboard/index.html';
                } else {
                    throw new Error('Falha no login. Tente novamente.');
                }
            } catch (err) {
                // Tratamento robusto de erros
                let msg;
                const errMsg = err.message.toLowerCase();
                if (errMsg.includes('invalid login') || errMsg.includes('credentials')) {
                    msg = 'Email ou senha incorretos.';
                } else if (errMsg.includes('network') || errMsg.includes('fetch') || errMsg.includes('failed to fetch')) {
                    msg = 'Erro de conexão. Verifique sua internet e tente novamente.';
                } else {
                    msg = err.message || 'Erro inesperado. Tente novamente.';
                }
                showGlobalError(msg);
            } finally {
                // Reset do loading state
                loginBtn.classList.remove('loading');
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
                setTimeout(validateForm, 100);
            }
        });

        // Validação inicial
        validateForm();

        // Carrega email lembrado se existir
        const rememberedEmail = localStorage.getItem('remembered_email');
        if (rememberedEmail) {
            emailIn.value = rememberedEmail;
            rememberCh.checked = true;
            validateEmail();
            validateForm();
        }
    </script>
</body>
</html>
